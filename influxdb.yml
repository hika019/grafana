apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: grafana
spec:
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 0
      initContainers:
      - name: fix-permissions
        # image: busybox:1.35
        image: python:3.11-slim
        command: ['sh', '-c']
        args:
          - |
            chown -R 1000:1000 /var/lib/influxdb2
            chmod -R 755 /var/lib/influxdb2
            python -m venv /plugins/.venv && /plugins/.venv/bin/pip install --upgrade pip
        volumeMounts:
        - mountPath: /var/lib/influxdb2
          name: pv-influxdb
        - name: plugins
          mountPath: /plugins

      containers:
        - name: influxdb
          image: influxdb:2.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: influxdb
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: INFLUXDB_ADMIN_USER
              value: "admin"
            - name: INFLUXDB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: influxdb-admin-token
                  key: admin-token.json
            - name: INFLUXDB_DB
              value: "mydb"
        
          volumeMounts:
            - name: pv-influxdb
              mountPath: /var/lib/influxdb2
            - name: admin-token
              mountPath: /etc/influxdb
              readOnly: true
            # - name: plugins
            #  mountPath: /plugins
            
      volumes:
        - name: pv-influxdb
          persistentVolumeClaim:
            claimName: pvc-influxdb
        - name: admin-token
          secret:
            secretName: influxdb-admin-token
            defaultMode: 0600
        - name: plugins
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: grafana
spec:
  type: NodePort
  selector:
    app: influxdb
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      nodePort: 30086
