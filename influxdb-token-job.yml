apiVersion: v1
kind: ServiceAccount
metadata:
  name: influxdb-token-init
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: influxdb-token-init
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["influxdb-admin-token"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: influxdb-token-init
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: influxdb-token-init
    namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: influxdb-token-init
---
apiVersion: batch/v1
kind: Job
metadata:
  name: influxdb-token-init
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: influxdb-token-init
      restartPolicy: Never
      containers:
        - name: generate-token
          image: alpine/kubectl:1.33.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if kubectl get secret influxdb-admin-token -n grafana >/dev/null 2>&1; then
                echo "Secret already exists; leaving it unchanged."
                exit 0
              fi
              TOKEN="apiv3_$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
              kubectl create secret generic influxdb-admin-token \
                -n grafana \
                --from-literal="admin-token.json={\"token\":\"${TOKEN}\",\"name\":\"_admin\"}"
              unset TOKEN
              echo "InfluxDB admin token Secret created."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
